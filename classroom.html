<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 강의실 — 한신대학교 디지털새싹 사업단</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=44">
<style>
  .cr-wrap{display:grid;grid-template-columns:302px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){ .cr-wrap{grid-template-columns:1fr;} }

  /* 차시 목록 */
  .cr-side{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
    padding:18px;position:sticky;top:82px;}
  @media (max-width:900px){ .cr-side{position:static;} }
  .cr-side h3{font-size:.98rem;font-weight:800;color:#28352E;letter-spacing:-.01em;}
  .cr-rate{margin:12px 0 16px;}
  .cr-rate .bar{height:8px;border-radius:99px;background:#E9EFEA;overflow:hidden;}
  .cr-rate .bar i{display:block;height:100%;background:var(--leaf);
    border-radius:99px;transition:width .35s;}
  .cr-rate .txt{margin-top:7px;font-size:.8rem;font-weight:700;color:#6A776F;}
  .cr-rate .txt b{color:var(--leaf);}
  .cr-list{display:flex;flex-direction:column;gap:6px;list-style:none;}
  .cr-list li{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;
    border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background .12s;}
  .cr-list li:hover{background:#F4F7F5;}
  .cr-list li.on{background:#F1FAF4;border-color:var(--leaf);}
  .cr-list .ic{flex:none;width:22px;text-align:center;font-size:.9rem;line-height:1.5;}
  .cr-list .tx{font-size:.85rem;line-height:1.5;color:#3A4842;font-weight:600;}
  .cr-list .mt{display:block;margin-top:3px;font-size:.73rem;font-weight:600;color:#8A968E;}
  .cr-list li.done .tx{color:#6A776F;}

  /* 본문 */
  .cr-main{display:flex;flex-direction:column;gap:18px;}
  .cr-head{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
  .cr-head .tagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
  .cr-head h2{font-size:1.24rem;font-weight:800;letter-spacing:-.02em;color:#28352E;}
  .cr-head p{margin-top:9px;font-size:.9rem;line-height:1.7;color:#5A6862;}
  .lesson-mode{font-size:.73rem;font-weight:800;padding:3px 9px;border-radius:6px;}
  .lesson-mode.on{background:var(--navy-soft,#E7EDF5);color:var(--navy);}
  .lesson-mode.off{background:#FDF3E8;color:#9A6420;}

  .cr-video{position:relative;width:100%;aspect-ratio:16/9;background:#1A231E;
    border-radius:var(--radius);overflow:hidden;}
  .cr-video iframe{width:100%;height:100%;border:0;display:block;}
  .cr-watch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:13px 18px;background:#fff;border:1.5px solid var(--line);border-radius:13px;}
  .cr-watch .wbar{flex:1;min-width:150px;height:7px;border-radius:99px;background:#E9EFEA;overflow:hidden;}
  .cr-watch .wbar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .4s;}
  .cr-watch .wtx{font-size:.82rem;font-weight:700;color:#5A6862;white-space:nowrap;}
  .cr-watch .wtx.done{color:var(--leaf);}

  .cr-note{padding:18px 20px;background:var(--paper);border:1px solid var(--line);
    border-radius:13px;font-size:.86rem;line-height:1.75;color:#5A6862;}
  .cr-note b{color:#3A4842;}

  /* 과제 */
  .cr-task{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
  .cr-task h3{font-size:1rem;font-weight:800;color:#28352E;letter-spacing:-.01em;}
  .cr-task .guide{margin-top:9px;padding:13px 15px;background:var(--paper);
    border:1px solid var(--line);border-radius:10px;font-size:.87rem;line-height:1.7;color:#4A5850;}
  .cr-task form{margin-top:15px;}
  .cr-sub{margin-top:13px;padding:14px 16px;border-radius:11px;
    background:#F1FAF4;border:1px solid #B9E2C8;font-size:.86rem;line-height:1.7;color:#2E5F44;}
  .cr-sub b{font-weight:800;}
  .cr-sub a{color:var(--navy);text-decoration:underline;word-break:break-all;}
  .cr-sub.warn{background:#FDF3E8;border-color:#F0D9BC;color:#8C5A1E;}

  .tf-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .tf-item{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;
    background:rgba(255,255,255,.75);border:1px solid var(--line);
    font-size:.84rem;font-weight:700;color:var(--navy);text-decoration:none;word-break:break-all;}
  .tf-item:hover{border-color:var(--navy);}
  .tf-item span{font-weight:600;color:#8A968E;font-size:.78rem;}
  .cr-task input[type=file]{width:100%;padding:9px 12px;border:1.5px dashed var(--line);
    border-radius:10px;background:var(--paper);font-size:.85rem;}

  .cr-nav{display:flex;gap:10px;flex-wrap:wrap;}
  .cr-nav .btn{flex:1;text-align:center;text-decoration:none;}
  .cr-msg{padding:44px 28px;text-align:center;background:#fff;
    border:1px dashed var(--line);border-radius:var(--radius);
    font-size:.94rem;line-height:1.8;color:#6A776F;}
  .cr-msg a{color:var(--leaf);font-weight:700;text-decoration:underline;}
</style>
</head>
<body>

<header id="site-header"></header>

<div class="page-title">
  <div class="page-title-inner">
    <span class="tag">CLASSROOM</span>
    <h1 id="crTitle">내 강의실</h1>
    <p id="crSub">신청하신 워크샵의 온라인 차시를 여기서 이수하실 수 있습니다.</p>
  </div>
</div>

<section>
  <div class="section">
    <div id="crRoot">
      <div class="cr-msg">강의실을 불러오는 중입니다…</div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<!-- 레이아웃은 Firebase와 무관하게 먼저 렌더링 -->
<script type="module">
  import { initLayout } from './js/common.js';
  initLayout('classroom');
</script>

<script type="module">
import { esc, fbError, toast, acceptedOnlineKeys, mdToHtml } from './js/common.js';

const root = document.getElementById('crRoot');
const params = new URLSearchParams(location.search);
const enrollId = params.get('enroll') || '';

if (!enrollId){
  root.innerHTML = `<div class="cr-msg">잘못된 접근입니다.<br>
    <a href="mypage.html">마이페이지</a>의 <b>내 강의실</b>에서 수강할 과정을 선택해주세요.</div>`;
  throw new Error('no enroll id');
}

let db, auth, storage, fs, st, onAuthStateChanged;
try {
  ({ db, auth, storage } = await import('./js/firebase-init.js'));
  fs = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js");
  st = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js");
  ({ onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js"));
} catch (e){
  root.innerHTML = `<div class="cr-msg">강의실을 불러오지 못했습니다.<br>네트워크 상태를 확인한 뒤 새로고침해주세요.</div>`;
  throw e;
}
const { doc, getDoc, getDocs, collection, setDoc, serverTimestamp, query, where } = fs;

let enr = null, course = null, lessons = [], progress = {};
let current = null;         // 현재 보고 있는 차시
let player = null, tick = null;
let watched = 0, maxPos = 0, lastPos = 0, dirty = false;

/* ---------- 진입 ---------- */
onAuthStateChanged(auth, async user => {
  if (!user){
    root.innerHTML = `<div class="cr-msg">로그인이 필요합니다.<br>
      <a href="mypage.html">마이페이지</a>에서 로그인한 뒤 다시 들어와주세요.</div>`;
    return;
  }
  try {
    const snap = await getDoc(doc(db, 'enrollments', enrollId));
    if (!snap.exists()){ root.innerHTML = `<div class="cr-msg">수강 신청 내역을 찾을 수 없습니다.</div>`; return; }
    enr = { id: snap.id, ...snap.data() };

    if (enr.uid !== user.uid){
      root.innerHTML = `<div class="cr-msg">본인의 수강 내역만 확인할 수 있습니다.<br>
        <a href="mypage.html">마이페이지</a>에서 확인해주세요.</div>`;
      return;
    }

    const cs = await getDoc(doc(db, 'onlineCourses', enr.courseKey));
    course = cs.exists() ? { key: cs.id, ...cs.data() } : null;

    const ls = await getDocs(collection(db, 'onlineCourses', enr.courseKey, 'lessons'));
    lessons = ls.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));

    const pr = await getDocs(collection(db, 'enrollments', enrollId, 'progress'));
    progress = Object.fromEntries(pr.docs.map(d => [d.id, d.data()]));

    /* v24: 미니(교구 사용법) 워크샵을 이미 수료한 수강생은 이 과목의
       오프라인(교구 실습) 차시를 자동 출석 처리합니다 —
       미니 워크샵 참석이 곧 해당 차시의 현장 실습이기 때문입니다. */
    try { await syncMiniAttendance(user); } catch (e){ /* 실패해도 수강에는 지장 없음 */ }

    if (!lessons.length){
      root.innerHTML = `<div class="cr-msg">아직 등록된 차시가 없습니다.<br>
        차시가 열리면 안내드리겠습니다.</div>`;
      return;
    }
    document.getElementById('crTitle').textContent = enr.courseName || course?.name || '내 강의실';
    document.getElementById('crSub').textContent =
      '온라인 차시는 영상 시청으로, 교구 실습 차시는 오프라인 워크샵 참석으로 이수됩니다.';

    const first = lessons.find(l => !isDone(l)) || lessons[0];
    render(first.id);
  } catch (err){
    root.innerHTML = `<div class="cr-msg">${esc(fbError(err))}</div>`;
  }
});

/* ---------- v24: 미니 워크샵 수료 → 오프라인 차시 자동 출석 ---------- */
async function syncMiniAttendance(user){
  const offline = lessons.filter(l => l.mode === 'offline' && !(progress[l.id]?.done));
  if (!offline.length) return;
  /* 내 신청 내역 중 '수료 처리된 미니(교구) 워크샵'이 이 과목과 대응하는지 확인 */
  const snap = await getDocs(query(collection(db, 'applications'), where('uid', '==', user.uid)));
  const hasMini = snap.docs.some(d => {
    const a = d.data();
    const mini = a.programWsKind === 'mini' || (!a.programWsKind && /미니|mini|교구/i.test(a.programTitle || ''));
    return mini && a.completed && acceptedOnlineKeys(a.course || a.session || '').includes(enr.courseKey);
  });
  if (!hasMini) return;
  for (const l of offline){
    await setDoc(doc(db, 'enrollments', enrollId, 'progress', l.id), {
      done: true, doneAt: serverTimestamp(), checkedBy: 'miniWorkshop', lastAt: serverTimestamp()
    }, { merge: true });
    progress[l.id] = { ...(progress[l.id] || {}), done: true };
  }
  toast('미니 워크샵 수료가 확인되어 교구 실습 차시가 출석 처리되었습니다.');
}

/* ---------- 판정 ---------- */
function isDone(l){
  const p = progress[l.id];
  if (!p) return false;
  if (l.mode === 'offline') return !!p.done;
  if (p.done) return true;
  if (!l.durationSec) return false;
  return (p.watchedSec || 0) >= l.durationSec * 0.9;
}
function rate(){
  const req = lessons.filter(l => l.required !== false);
  if (!req.length) return 0;
  return Math.round(req.filter(isDone).length / req.length * 100);
}

/* ---------- 렌더 ---------- */
function render(lessonId){
  stopTracking();
  current = lessons.find(l => l.id === lessonId) || lessons[0];
  const r = rate();
  const idx = lessons.indexOf(current);
  const prev = lessons[idx - 1], next = lessons[idx + 1];
  const online = current.mode !== 'offline';
  const p = progress[current.id] || {};

  root.innerHTML = `
  <div class="cr-wrap">
    <aside class="cr-side">
      <h3>차시 목록</h3>
      <div class="cr-rate">
        <div class="bar"><i style="width:${r}%"></i></div>
        <div class="txt">필수 차시 진도 <b>${r}%</b></div>
      </div>
      <ul class="cr-list">
        ${lessons.map(l => `<li class="${l.id === current.id ? 'on' : ''} ${isDone(l) ? 'done' : ''}"
            data-lesson="${l.id}">
          <span class="ic">${isDone(l) ? '✅' : (l.mode === 'offline' ? '🧰' : '▶️')}</span>
          <span class="tx">${l.order}. ${esc(l.title)}
            <span class="mt">${l.mode === 'offline' ? '교구 실습 · 현장 출석' : '온라인 영상'}${
              l.required === false ? ' · 선택' : ''}${l.hasTask ? ' · 과제' : ''}</span>
          </span>
        </li>`).join('')}
      </ul>
    </aside>

    <div class="cr-main">
      <div class="cr-head">
        <div class="tagline">
          <span class="lesson-mode ${online ? 'on' : 'off'}">${online ? '💻 온라인' : '🧰 오프라인'}</span>
          <span class="cell-sub">${current.order}차시${current.required === false ? ' · 선택 차시' : ''}</span>
        </div>
        <h2>${esc(current.title)}</h2>
        ${current.desc ? `<div class="md">${mdToHtml(current.desc)}</div>` : ''}
      </div>

      ${online ? (current.videoId ? `
        <div class="cr-video"><div id="ytPlayer"></div></div>
        <div class="cr-watch">
          <span class="wtx">시청 진도</span>
          <span class="wbar"><i id="wFill" style="width:0%"></i></span>
          <span class="wtx" id="wTxt">0%</span>
        </div>` : `
        <div class="cr-note">아직 영상이 등록되지 않은 차시입니다. 등록되면 이곳에서 시청하실 수 있습니다.</div>`)
      : `<div class="cr-note">
          이 차시는 <b>교구 실습이 포함된 오프라인 차시</b>입니다.
          현장에서 참여하시면 사업단이 출석을 확인해 이수 처리해드립니다.
          ${current.place ? `<br><br>📍 <b>${esc(current.place)}</b>` : ''}
          <br><br>현재 상태: <b>${isDone(current) ? '✅ 출석 확인됨' : '⏳ 출석 확인 전'}</b>
        </div>`}

      ${current.hasTask ? taskHTML(p) : ''}

      <div class="cr-nav">
        ${prev ? `<button class="btn btn-outline btn-sm" data-go="${prev.id}">← ${prev.order}차시</button>` : ''}
        ${next ? `<button class="btn btn-navy btn-sm" data-go="${next.id}">${next.order}차시 →</button>` : ''}
        <a class="btn btn-outline btn-sm" href="mypage.html">마이페이지로</a>
      </div>
    </div>
  </div>`;

  root.querySelectorAll('[data-lesson]').forEach(li =>
    li.addEventListener('click', () => render(li.dataset.lesson)));
  root.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => { render(b.dataset.go); window.scrollTo({top:0,behavior:'smooth'}); }));

  const tf = document.getElementById('taskForm');
  if (tf) tf.addEventListener('submit', submitTask);

  if (online && current.videoId) mountPlayer();
}

function fileRow(f){
  const kb = f.size ? (f.size > 1048576 ? (f.size/1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(f.size/1024)) + 'KB') : '';
  return `<a class="tf-item" href="${esc(f.url)}" target="_blank" rel="noopener">📎 ${esc(f.name)}${kb ? ` <span>${kb}</span>` : ''}</a>`;
}

function taskHTML(p){
  const submitted = !!p.taskAt;
  const files = Array.isArray(p.taskFiles) ? p.taskFiles : [];
  return `<div class="cr-task">
    <h3>📝 과제 제출</h3>
    <div class="guide md">${current.taskDesc ? mdToHtml(current.taskDesc) : '<p>과제 안내가 등록되지 않았습니다.</p>'}</div>
    ${submitted ? `<div class="cr-sub ${p.taskOk === false ? 'warn' : ''}">
        <b>${p.taskOk === false ? '보완 요청됨' : (p.taskOk === true ? '확인 완료' : '제출 완료')}</b>
        ${p.taskUrl ? `<br>링크 · <a href="${esc(p.taskUrl)}" target="_blank" rel="noopener">${esc(p.taskUrl)}</a>` : ''}
        ${p.taskText ? `<br>내용 · ${esc(p.taskText).replace(/\n/g, '<br>')}` : ''}
        ${files.length ? `<div class="tf-list">${files.map(fileRow).join('')}</div>` : ''}
        ${p.taskReview ? `<br>사업단 메모 · ${esc(p.taskReview)}` : ''}
        <br><span class="cell-sub">다시 제출하면 내용이 갱신됩니다.</span>
      </div>` : ''}
    <form id="taskForm">
      <div class="form-error" id="taskError"></div>
      <div class="form-row">
        <label for="t-file">파일 첨부 <span class="hint">(이미지·PDF·문서 등 · 1개당 20MB 이하 · 최대 5개)</span></label>
        <input id="t-file" type="file" multiple>
        <p class="form-note" style="margin-top:6px;">새로 첨부하면 기존 첨부는 교체됩니다. 파일 없이 링크·설명만 제출해도 됩니다.</p>
      </div>
      <div class="form-row">
        <label for="t-url">제출 링크 <span class="hint">(캔바·구글 드라이브·유튜브 등)</span></label>
        <input id="t-url" type="url" placeholder="https://" value="${esc(p.taskUrl || '')}">
      </div>
      <div class="form-row">
        <label for="t-text">설명 / 소감</label>
        <textarea id="t-text" rows="3" placeholder="과제에 대한 설명이나 소감을 적어주세요.">${esc(p.taskText || '')}</textarea>
      </div>
      <button type="submit" class="btn btn-navy btn-sm" id="taskBtn">${submitted ? '다시 제출' : '과제 제출'}</button>
    </form>
  </div>`;
}

async function submitTask(e){
  e.preventDefault();
  const url = document.getElementById('t-url').value.trim();
  const text = document.getElementById('t-text').value.trim();
  const picked = [...(document.getElementById('t-file').files || [])].slice(0, 5);
  const errBox = document.getElementById('taskError');
  const prev = progress[current.id] || {};
  const keepFiles = Array.isArray(prev.taskFiles) ? prev.taskFiles : [];

  if (!url && !text && !picked.length && !keepFiles.length){
    errBox.textContent = '파일·링크·설명 중 하나는 제출해주세요.';
    errBox.style.display = 'block';
    return;
  }
  const tooBig = picked.find(f => f.size > 20 * 1024 * 1024);
  if (tooBig){
    errBox.textContent = `${tooBig.name} 파일이 20MB를 넘습니다. 용량을 줄여 다시 첨부해주세요.`;
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('taskBtn');
  btn.disabled = true; btn.textContent = '제출 중…';
  errBox.style.display = 'none';
  try {
    /* 새 파일이 있으면 업로드해 교체, 없으면 기존 첨부 유지 */
    let files = keepFiles;
    if (picked.length){
      files = [];
      for (let i = 0; i < picked.length; i++){
        const f = picked[i];
        btn.textContent = `업로드 중… (${i + 1}/${picked.length})`;
        const safe = f.name.replace(/[^\w.\-가-힣 ]/g, '_');
        const path = `taskFiles/${enr.uid}/${enrollId}_${current.id}/${Date.now()}_${safe}`;
        const ref = st.ref(storage, path);
        await st.uploadBytes(ref, f);
        files.push({ name: f.name, size: f.size, url: await st.getDownloadURL(ref), path });
      }
    }
    btn.textContent = '저장 중…';
    await setDoc(doc(db, 'enrollments', enrollId, 'progress', current.id), {
      taskUrl: url, taskText: text, taskFiles: files,
      taskAt: serverTimestamp(), taskOk: null, taskReview: '',
      lastAt: serverTimestamp()
    }, { merge: true });
    progress[current.id] = { ...(progress[current.id] || {}),
      taskUrl: url, taskText: text, taskFiles: files,
      taskAt: new Date(), taskOk: null, taskReview: '' };
    toast('과제를 제출했습니다.');
    render(current.id);
  } catch (err){
    errBox.textContent = /storage|CORS|unauthorized/i.test(String(err?.code || err))
      ? '파일 업로드에 실패했습니다. 잠시 후 다시 시도하거나, 링크로 제출해주세요.'
      : fbError(err);
    errBox.style.display = 'block';
  } finally { btn.disabled = false; }
}

/* ---------- YouTube 플레이어 · 진도 추적 ---------- */
function mountPlayer(){
  const p = progress[current.id] || {};
  watched = p.watchedSec || 0;
  maxPos  = p.maxPos || 0;
  lastPos = 0; dirty = false;
  paintWatch();

  const start = () => {
    player = new YT.Player('ytPlayer', {
      videoId: current.videoId,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onStateChange: ev => {
          if (ev.data === YT.PlayerState.PLAYING) startTracking();
          else { stopTracking(); saveProgress(); }
        }
      }
    });
  };
  if (window.YT && window.YT.Player) start();
  else {
    window.onYouTubeIframeAPIReady = start;
    if (!document.getElementById('ytApi')){
      const s = document.createElement('script');
      s.id = 'ytApi'; s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
  }
}

function startTracking(){
  stopTracking();
  lastPos = player ? player.getCurrentTime() : 0;
  tick = setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const now = player.getCurrentTime();
    const delta = now - lastPos;
    /* 앞으로 건너뛰거나 되감으면 그 구간은 시청 시간에 넣지 않습니다 */
    if (delta > 0 && delta <= 3) watched += delta;
    if (now > maxPos) maxPos = now;
    lastPos = now;
    dirty = true;
    paintWatch();
    if (Math.floor(now) % 15 === 0) saveProgress();
  }, 1000);
}
function stopTracking(){ if (tick){ clearInterval(tick); tick = null; } }

function paintWatch(){
  const fill = document.getElementById('wFill');
  const txt = document.getElementById('wTxt');
  if (!fill || !txt || !current.durationSec) return;
  const pct = Math.min(100, Math.round(watched / current.durationSec * 100));
  fill.style.width = pct + '%';
  const done = pct >= 90;
  txt.textContent = done ? '✅ 이수 완료' : pct + '%';
  txt.classList.toggle('done', done);
}

let saving = false;
async function saveProgress(){
  if (!dirty || saving || !current) return;
  saving = true; dirty = false;
  const done = !!current.durationSec && watched >= current.durationSec * 0.9;
  const wasDone = isDone(current);
  try {
    await setDoc(doc(db, 'enrollments', enrollId, 'progress', current.id), {
      watchedSec: Math.round(watched),
      maxPos: Math.round(maxPos),
      ...(done ? { done: true, doneAt: serverTimestamp() } : {}),
      lastAt: serverTimestamp()
    }, { merge: true });
    progress[current.id] = { ...(progress[current.id] || {}),
      watchedSec: watched, maxPos, done: done || undefined };
    if (done && !wasDone){
      toast('이 차시를 이수했습니다.');
      const li = root.querySelector(`[data-lesson="${current.id}"]`);
      if (li){ li.classList.add('done'); li.querySelector('.ic').textContent = '✅'; }
      const bar = root.querySelector('.cr-rate .bar i');
      const rt = root.querySelector('.cr-rate .txt b');
      if (bar && rt){ const r = rate(); bar.style.width = r + '%'; rt.textContent = r + '%'; }
    }
  } catch (err){ console.error(err); }
  finally { saving = false; }
}

window.addEventListener('beforeunload', () => { if (dirty) saveProgress(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ stopTracking(); saveProgress(); } });
</script>
